<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1000" viewBox="0 0 640 1000" role="img" aria-labelledby="title description">
<title id="title">Product engineering across projects: compact view</title><desc id="description">Conceptual patterns across multiple projects, not a single employer deployment. Web, mobile and backoffice connect to APIs and BFFs. APIs connect to agent systems and domain services. Agents connect to AI context and domain services; domain services connect to data and external providers. Dashed paths connect AI context and data to production delivery.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8FA9C9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="640" height="1000" rx="24" fill="#0B1220"/>
<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<text x="32" y="39" font-size="17" font-weight="700" fill="#4CD6FF">CROSS-PROJECT / CONCEPTUAL VIEW</text>
<text x="32" y="80" font-size="30" font-weight="700" fill="#EDF3FF">From product needs to production</text>
<text x="32" y="113" font-size="20" font-weight="400" fill="#B0C0D6">Engineering patterns, not one deployment</text>
<path data-edge="UX-APP" d="M320 261 V325" fill="none" stroke="#8FA9C9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path data-edge="APP-DATA" d="M320 505 V569" fill="none" stroke="#8FA9C9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path data-edge="DATA-OPS" d="M320 719 V783" fill="none" stroke="#8FA9C9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<g data-node="UX"><rect x="48" y="145" width="544" height="116" rx="18" fill="#17263B" stroke="#38506C" stroke-width="1.5"/>
<rect x="48" y="163" width="4" height="80" rx="2" fill="#4CD6FF"/>
<text x="68" y="181" font-size="25" font-weight="650" fill="#EDF3FF">PRODUCT EXPERIENCE</text>
<text x="68" y="213" font-size="20" font-weight="400" fill="#B0C0D6">Web · Mobile · Backoffice</text>
</g>
<g data-node="APP"><rect x="48" y="325" width="544" height="180" rx="18" fill="#17263B" stroke="#38506C" stroke-width="1.5"/>
