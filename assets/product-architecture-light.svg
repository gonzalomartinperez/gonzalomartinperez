chart-label text{text-anchor:middle;}#productArchitecturelight .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#productArchitecturelight .node .label{text-align:center;}#productArchitecturelight .node.clickable{cursor:pointer;}#productArchitecturelight .arrowheadPath{fill:#050504;}#productArchitecturelight .edgePath .path{stroke:#0a6e9b;stroke-width:2.0px;}#productArchitecturelight .flowchart-link{stroke:#0a6e9b;fill:none;}#productArchitecturelight .edgeLabel{background-color:#fafafb;text-align:center;}#productArchitecturelight .edgeLabel rect{opacity:0.5;background-color:#fafafb;fill:#fafafb;}#productArchitecturelight .labelBkg{background-color:rgba(250, 250, 251, 0.5);}#productArchitecturelight .cluster rect{fill:#fafafb;stroke:#d5dae2;stroke-width:1px;}#productArchitecturelight .cluster text{fill:#0a6e9b;}#productArchitecturelight .cluster span,#productArchitecturelight p{color:#0a6e9b;}#productArchitecturelight div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:Arial,Helvetica,sans-serif;font-size:12px;background:#fafafb;border:1px solid hsl(240, 0%, 88.2352941176%);border-radius:2px;pointer-events:none;z-index:100;}#productArchitecturelight .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#0f141b;}#productArchitecturelight :root{--mermaid-font-family:Arial,Helvetica,sans-serif;}</style><rect x="-8" y="-8" width="736.52734375" height="924" rx="20" fill="#fafafb"/><g><marker orient="auto" markerHeight="12" markerWidth="12" markerUnits="userSpaceOnUse" refY="5" refX="6" viewBox="0 0 10 10" class="marker flowchart" id="productArchitecturelight_flowchart-pointEnd"><path style="stroke-width: 1; stroke-dasharray: 1, 0;" class="arrowMarkerPath" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker orient="auto" markerHeight="12" markerWidth="12" markerUnits="userSpaceOnUse" refY="5" refX="4.5" viewBox="0 0 10 10" class="marker flowchart" id="productArchitecturelight_flowchart-pointStart"><path style="stroke-width: 1