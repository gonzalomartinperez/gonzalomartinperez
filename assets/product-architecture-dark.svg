<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1230" viewBox="0 0 640 1230" role="img" aria-labelledby="title description">
<title id="title">Product engineering across projects</title><desc id="description">Conceptual patterns across multiple projects, not a single employer deployment. Web, mobile and backoffice connect to APIs and BFFs. APIs connect to agent systems and domain services. Agents connect to AI context and domain services; domain services connect to data and external providers. Dashed paths connect AI context and data to production delivery.</desc>
